name: tests
on: [push, pull_request]
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: tests/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: tests/requirements-dev.txt }
      - run: npm ci
        working-directory: tests
      - run: npx playwright-core install --with-deps chromium
        working-directory: tests
      - run: pip install -r requirements-dev.txt
        working-directory: tests
      - run: npm test            # unit, server, e2e, a11y, layout, pwa; fails on any failed or unstartable suite
        working-directory: tests
